name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.profile }}, Java ${{ matrix.java }})
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: apache-upstream
            java: 17
          - profile: apache-upstream
            java: 21
          - profile: cdp-7.3.2-sp1
            java: 17
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, package, and enforce coverage
        run: ./mvnw -B -ntp -P${{ matrix.profile }} clean verify
      - name: Upload coverage report
        if: matrix.java == 17
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-${{ matrix.profile }}-java-${{ matrix.java }}
          path: '*/target/site/jacoco/'
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      (vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir . --max-retries 3 --timeout 30
            './**/*.md' './**/*.adoc'
          fail: true
          failIfEmpty: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  ci-success:
    name: CI Success
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    needs: [test, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "${TEST_RESULT}" = "success"
          test "${DEPENDENCY_REVIEW_RESULT}" = "success" || \
            test "${DEPENDENCY_REVIEW_RESULT}" = "skipped"
