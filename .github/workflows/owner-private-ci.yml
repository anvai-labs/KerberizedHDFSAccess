name: Owner Private CI

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: owner-private-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OWNER_GITHUB_USER_ID: "5168752"

jobs:
  authorize-owner:
    name: Authorize owner private CI
    environment: owner-private-ci
    if: >-
      vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.id == 5168752 &&
      github.actor_id == '5168752' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and same-repository head
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"

  test:
    name: Test (${{ matrix.profile }}, Java ${{ matrix.java }})
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: apache-upstream
            java: 17
          - profile: apache-upstream
            java: 21
          - profile: cdp-7.3.2-sp1
            java: 17
    steps:
      - name: Verify trusted PR identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
      - name: Check out exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test, package, and enforce coverage
        run: ./mvnw -B -ntp -P${{ matrix.profile }} clean verify

  dependency-review:
    name: Dependency review
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 10
    steps:
      - name: Check out the exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir . --max-retries 3 --timeout 30
            './**/*.md' './**/*.adoc'
          fail: true
          failIfEmpty: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  ci-success:
    name: CI Success
    if: always() && needs.authorize-owner.result == 'success'
    needs: [authorize-owner, test, dependency-review]
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify private test matrix
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "${TEST_RESULT}" = "success"
          test "${DEPENDENCY_REVIEW_RESULT}" = "success"
